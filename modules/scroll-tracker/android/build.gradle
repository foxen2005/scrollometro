plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'cl.digitalfox'
version = '0.1.0'

android {
  namespace "cl.digitalfox.scrolltracker"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    // Claves del ranking (dreamlo). Se leen de ~/.gradle/gradle.properties: NO están en el repo público.
    // Sin ellas el ranking queda desactivado (la app funciona igual).
    buildConfigField "String", "DREAMLO_PRIVATE", "\"${findProperty('DREAMLO_PRIVATE') ?: ''}\""
    buildConfigField "String", "DREAMLO_PUBLIC", "\"${findProperty('DREAMLO_PUBLIC') ?: ''}\""
  }
  buildFeatures {
    buildConfig true
  }
}

dependencies {
  implementation 'androidx.core:core:1.17.0'
}
